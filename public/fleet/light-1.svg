<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#081333"/>
      <stop offset="60%" style="stop-color:#0e2150"/>
      <stop offset="100%" style="stop-color:#1f5fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Stylised light jet silhouette -->
  <g transform="translate(400,200)" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <!-- fuselage -->
    <path d="M-180,10 Q-120,-18 0,-14 Q80,-12 160,-8 Q200,-6 210,8 Q200,22 160,24 Q80,28 0,20 Q-120,16 -180,10 Z" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)"/>
    <!-- main wing -->
    <path d="M-40,-14 L-20,-60 L60,-52 L80,-14 Z" fill="rgba(47,126,240,0.18)" stroke="rgba(47,126,240,0.35)"/>
    <!-- tail fin -->
    <path d="M150,-14 L162,-42 L176,-14 Z" fill="rgba(20,184,166,0.18)" stroke="rgba(20,184,166,0.35)"/>
    <!-- horizontal stab -->
    <path d="M148,12 L150,28 L180,24 L180,12 Z" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)"/>
  </g>
  <!-- Label -->
  <text x="400" y="340" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="4">THE MERIDIAN · LIGHT JET</text>
  <!-- Star accent -->
  <text x="400" y="80" font-size="28" fill="rgba(20,184,166,0.6)" text-anchor="middle">✦</text>
</svg>
