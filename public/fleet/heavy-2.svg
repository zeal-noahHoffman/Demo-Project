<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#050c22"/>
  <!-- Stars suggestion -->
  <circle cx="100" cy="60" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="260" cy="35" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="450" cy="50" r="1.3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="650" cy="40" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="720" cy="70" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <!-- Private suite layout -->
  <rect x="100" y="90" width="600" height="220" rx="16" fill="rgba(31,95,208,0.06)" stroke="rgba(31,95,208,0.18)" stroke-width="1"/>
  <!-- Bed suite (forward) -->
  <rect x="120" y="108" width="180" height="130" rx="10" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.26)" stroke-width="1"/>
  <text x="210" y="176" font-family="system-ui,sans-serif" font-size="11" fill="rgba(20,184,166,0.55)" text-anchor="middle" letter-spacing="2">PRIVATE SUITE</text>
  <!-- Lounge area -->
  <rect x="320" y="108" width="180" height="130" rx="10" fill="rgba(47,126,240,0.06)" stroke="rgba(47,126,240,0.2)" stroke-width="1"/>
  <text x="410" y="176" font-family="system-ui,sans-serif" font-size="11" fill="rgba(47,126,240,0.55)" text-anchor="middle" letter-spacing="2">LOUNGE</text>
  <!-- Dine area -->
  <rect x="520" y="108" width="160" height="130" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="600" y="176" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="2">DINING</text>
  <text x="400" y="348" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="4">FULL-BED SUITE · 7,500 NM RANGE</text>
</svg>
