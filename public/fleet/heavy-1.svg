<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050c22"/>
      <stop offset="50%" style="stop-color:#081333"/>
      <stop offset="100%" style="stop-color:#0e2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="55%" r="60%">
      <stop offset="0%" style="stop-color:#34c8c0;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#34c8c0;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Stylised ultra-long-range jet — largest silhouette -->
  <g transform="translate(400,205)" fill="none">
    <!-- fuselage (long and wide) -->
    <path d="M-230,14 Q-160,-26 0,-18 Q100,-14 200,-8 Q260,-4 270,12 Q260,28 200,32 Q100,38 0,28 Q-160,22 -230,14 Z" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.26)" stroke-width="1.2"/>
    <!-- main wing (large sweep) -->
    <path d="M-70,-18 L-30,-88 L100,-70 L120,-18 Z" fill="rgba(47,126,240,0.20)" stroke="rgba(47,126,240,0.38)" stroke-width="1.2"/>
    <!-- winglet -->
    <line x1="120" y1="-18" x2="136" y2="-34" stroke="rgba(47,126,240,0.55)" stroke-width="2"/>
    <!-- opposite winglet suggestion -->
    <line x1="-30" y1="-88" x2="-42" y2="-100" stroke="rgba(47,126,240,0.35)" stroke-width="1.5"/>
    <!-- twin engines on wing -->
    <ellipse cx="30" cy="-38" rx="26" ry="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <ellipse cx="80" cy="-30" rx="22" ry="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- tail fin (tall) -->
    <path d="M190,-18 L206,-64 L222,-18 Z" fill="rgba(20,184,166,0.24)" stroke="rgba(20,184,166,0.46)" stroke-width="1.2"/>
    <!-- horizontal stab -->
    <path d="M186,16 L188,40 L224,36 L224,16 Z" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- nose cone detail -->
    <path d="M-230,14 Q-250,14 -260,12 Q-250,10 -230,10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  </g>
  <text x="400" y="340" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="4">THE SOVEREIGN · ULTRA-LONG-RANGE</text>
  <text x="400" y="76" font-size="26" fill="rgba(52,200,192,0.65)" text-anchor="middle">❖</text>
</svg>
